plugins {
    id 'multiloader-loader'
    id 'net.neoforged.moddev'
}

dependencies {
    api "fuzs.forgeconfigapiport:forgeconfigapiport-neoforge:${fcap_version}"
}

sourceSets {
    gametest {
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.output
        java.srcDir(project(':common').file('src/gametest/java'))
    }
}

neoForge {
    version = neoforge_version
    // Automatically enable neoforge AccessTransformers if the file exists
    def at = project(':common').file('src/main/resources/META-INF/accesstransformer.cfg')
    if (at.exists()) {
        accessTransformers.from(at.absolutePath)
    }
    runs {
        configureEach {
            systemProperty('neoforge.enabledGameTestNamespaces', mod_id)
            ideName = "NeoForge ${it.name.capitalize()} (${project.path})" // Unify the run config names with fabric
        }
        client {
            client()
        }
        data {
            clientData()
        }
        gameTestServer {
            type = 'gameTestServer'
            gameDirectory = project.file('runs/gametest')
            systemProperty('neoforge.enabledGameTestNamespaces', mod_id)
        }
        server {
            server()
        }
    }
    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
            sourceSet sourceSets.gametest
        }
    }
}

neoForge.addModdingDependenciesTo(sourceSets.gametest)

sourceSets.main.resources { srcDir 'src/generated/resources' }